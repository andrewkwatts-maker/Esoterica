[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "esoterica"
version = "1.2.0"
description = "Magic systems, spells, rituals, arcane traditions, and esoteric knowledge"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Andrew Watts", email = "andrewkwatts@gmail.com"},
]
keywords = ["magic", "spells", "rituals", "arcane", "esoteric", "occult", "traditions"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
]

dependencies = [
    "eyecore>=1.1.0",
]

[project.optional-dependencies]
bake = [
    "requests>=2.28",
]
scrape = [
    "feedparser>=6.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "praw>=7.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/andrewkwatts-maker/Esoterica"
Repository = "https://github.com/andrewkwatts-maker/Esoterica"
Issues = "https://github.com/andrewkwatts-maker/Esoterica/issues"

[tool.maturin]
# The workspace root manifest is virtual (it declares members, not a package),
# so the crate has to be named explicitly or maturin has nothing to build.
manifest-path = "rust/apocrypha_core/Cargo.toml"
python-source = "src"
module-name = "esoterica._core"
# `extension-module` implies `python` and additionally stops PyO3 linking
# libpython, which a wheel needs and a test binary cannot survive. Only the
# wheel build sets it; `cargo test --features python` links and runs normally.
features = ["extension-module"]
exclude = ["src/esoterica/_data/*.db.gz", "src/esoterica/_data/*.db"]

[tool.pytest.ini_options]
testpaths = ["tests"]
