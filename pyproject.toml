[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "esoterica"
version = "1.0.1"
description = "Magic systems, spells, rituals, arcane traditions, and esoteric knowledge"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    {name = "Andrew Watts", email = "andrewkwatts@gmail.com"},
]
keywords = ["magic", "spells", "rituals", "arcane", "esoteric", "occult", "traditions"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Database",
]

dependencies = [
    "eyecore>=1.0.0",
]

[project.optional-dependencies]
bake = [
    "requests>=2.28",
]
scrape = [
    "feedparser>=6.0",
    "requests>=2.28",
    "beautifulsoup4>=4.12",
    "praw>=7.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/andrewkwatts-maker/Esoterica"
Repository = "https://github.com/andrewkwatts-maker/Esoterica"
Issues = "https://github.com/andrewkwatts-maker/Esoterica/issues"

[tool.maturin]
python-source = "src"
module-name = "esoterica._core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
